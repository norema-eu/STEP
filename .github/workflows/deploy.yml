name: Pubblica su step.norema.eu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rigenera le pagine
        run: python3 build.py
      - name: Carica via FTP su SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _template/**
            _dashboard/**
            _anagrafica/**
            _interlocuzioni/**
            _norema/**
            _norema_page/**
            _personale/**
            preview/**
            deploy/**
            build.py
            xlsx_preview.py
            README.md
            SPACE_AI/data.json
            PRONTI_VIA/data.json
            HUMAN_SEAL/data.json
            **/.htaccess
            **/.htpasswd*
      - name: Intestazioni anti-cache e rimozione dei dati completi dal sito
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # -k: il certificato FTPS di SiteGround è condiviso e non riporta ftp.norema.eu
          C="curl -sS -k --ssl-reqd --user $FTP_USERNAME:$FTP_PASSWORD"
          B="ftp://$FTP_SERVER"
          # .htaccess principale: si conserva quello esistente e si aggiunge il blocco NOREMA una sola volta
          set +e; $C "$B/.htaccess" -o remote.htaccess; rc=$?; set -e
          if [ $rc -eq 78 ]; then : > remote.htaccess; echo "nessun .htaccess principale"; fi
          if [ $rc -ne 0 ] && [ $rc -ne 78 ]; then echo "lettura .htaccess non riuscita ($rc): non lo modifico"
          elif grep -q "NOREMA-STEP-CACHE" remote.htaccess; then echo "blocco già presente"
          else cat deploy/cache.htaccess >> remote.htaccess && $C -T remote.htaccess "$B/.htaccess" && echo ".htaccess aggiornato"; fi
          # Protezione con password: SiteGround l'ha applicata alle cartelle in minuscolo (alias);
          # si copia la stessa regola (stesso file utenti) nelle cartelle vere in maiuscolo, se manca.
          for D in SPACE_AI PRONTI_VIA HUMAN_SEAL DASHBOARD NOREMA; d=$(echo $D | tr 'A-Z' 'a-z'); do
            rm -f low.ht up.ht
            set +e; $C "$B/$d/.htaccess" -o low.ht; r1=$?; $C "$B/$D/.htaccess" -o up.ht; r2=$?; set -e
            if [ $r1 -ne 0 ] || ! grep -qi "AuthType" low.ht; then echo "$D: nessuna protezione impostata su /$d"; continue; fi
            if [ $r2 -eq 0 ] && grep -qi "AuthType" up.ht; then echo "$D: già protetta"; continue; fi
            if [ $r2 -eq 0 ]; then cat low.ht >> up.ht; else cp low.ht up.ht; fi
            $C -T up.ht "$B/$D/.htaccess" && echo "$D: protezione copiata da /$d"
          done
          for f in SPACE_AI/data.json PRONTI_VIA/data.json HUMAN_SEAL/data.json; do
            $C "$B/" -Q "DELE $f" -o /dev/null && echo "rimosso $f" || echo "non rimosso $f"
          done
