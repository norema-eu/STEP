name: Pubblica su step.norema.eu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rigenera le pagine
        run: python3 build.py
      - name: Carica via FTP su SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _template/**
            _dashboard/**
            _anagrafica/**
            _interlocuzioni/**
            preview/**
            deploy/**
            build.py
            xlsx_preview.py
            README.md
            SPACE_AI/data.json
            PRONTI_VIA/data.json
            HUMAN_SEAL/data.json
            **/.htaccess
            **/.htpasswd*
      - name: Rimuovi dal sito i dati completi dei progetti (contengono note interne NOREMA)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for f in SPACE_AI/data.json PRONTI_VIA/data.json HUMAN_SEAL/data.json; do
            curl -sS --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "DELE $f" -o /dev/null && echo "rimosso $f" || echo "$f già assente"
          done
